# Server Port
server.port=8080

# Database Connection (Pulling from .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
# DEV ONLY — disable before deploying
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

courtsense.pipeline.output.path=../data/output/coaching_payload.json
courtsense.pipeline.video.name=actual_badminton_match.mp4

# ── Required in .env ──────────────────────────────────────────
# DB_URL=jdbc:postgresql://localhost:5432/courtsensedb
# DB_USERNAME=your_db_user
# DB_PASSWORD=your_db_password
# GEMINI_API_KEY=your_gemini_key
# GEMINI_API_URL=https://generativelanguage.googleapis.com/...
# INTERNAL_SECRET_KEY=any_random_secret_string